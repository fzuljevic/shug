name: Deploy to VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace web

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'EOF'
            set -e

            cd /root/shug

            git fetch --prune origin
            git reset --hard "$DEPLOY_SHA"

            docker compose -f docker-compose.vps.yml --env-file .env.vps build --no-cache web
            docker compose -f docker-compose.vps.yml --env-file .env.vps build api

            docker compose -f docker-compose.vps.yml --env-file .env.vps up -d postgres

            docker compose -f docker-compose.vps.yml --env-file .env.vps run --rm api npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

            docker compose -f docker-compose.vps.yml --env-file .env.vps up -d --force-recreate web api caddy

            docker compose -f docker-compose.vps.yml --env-file .env.vps ps
          EOF

      - name: Health checks
        run: |
          check_url() {
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --output /dev/null "$1"
          }

          check_url https://api.shshug.com/api/health
          check_url https://api.shshug.com/api/health/db
          check_url https://shshug.com
          check_url https://shshug.com/recipes
          check_url https://shshug.com/blog
          check_url https://shshug.com/utils
